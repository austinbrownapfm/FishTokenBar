<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <clipPath id="bodyClip">
      <path d="M 582 199 C 548 176, 508 158, 472 154 C 400 143, 336 141, 296 145 C 214 151, 148 167, 108 179 L 108 221 C 158 239, 228 257, 308 261 C 400 263, 482 251, 522 231 C 548 221, 566 212, 582 199 Z"/>
    </clipPath>
    <linearGradient id="chromeSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6FAFB"/>
      <stop offset="0.42" stop-color="#DFE9ED"/>
      <stop offset="0.62" stop-color="#EAF2F4"/>
      <stop offset="1" stop-color="#FAFDFD"/>
    </linearGradient>
  </defs>

  <!-- ===================== TAIL ===================== -->
  <g id="tail" data-pivot="110,200">
    <path d="M 110 181 L 64 151 L 56 177 L 72 200 L 56 223 L 64 249 L 110 219 Z"
          fill="#C6D2D8" stroke="#465562" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#8A9AA4" stroke-width="1.4" opacity="0.7">
      <path d="M 106 187 L 68 161" fill="none"/>
      <path d="M 104 195 L 64 179" fill="none"/>
      <path d="M 104 206 L 64 200" fill="none"/>
      <path d="M 104 213 L 64 222" fill="none"/>
      <path d="M 106 219 L 68 240" fill="none"/>
    </g>
    <!-- faded spots on tail -->
    <g fill="#4A5560" opacity="0.6">
      <ellipse cx="94" cy="172" rx="2.4" ry="2"/>
      <ellipse cx="86" cy="186" rx="2.2" ry="1.8"/>
      <ellipse cx="96" cy="196" rx="2.2" ry="1.8"/>
      <ellipse cx="88" cy="208" rx="2.2" ry="1.8"/>
      <ellipse cx="96" cy="220" rx="2.2" ry="1.8"/>
    </g>
  </g>

  <!-- ===================== BODY ===================== -->
  <g id="body">
    <!-- dorsal -->
    <path d="M 360 152 C 350 110, 320 94, 290 100 C 298 120, 298 140, 288 152 Z"
          fill="#C6D2D8" stroke="#465562" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#8A9AA4" stroke-width="1.3" opacity="0.7" fill="none">
      <path d="M 298 148 L 298 106"/>
      <path d="M 312 150 L 314 102"/>
      <path d="M 328 150 L 334 106"/>
      <path d="M 344 150 L 350 118"/>
    </g>
    <g fill="#4A5560" opacity="0.55">
      <ellipse cx="310" cy="120" rx="2.2" ry="1.8"/>
      <ellipse cx="326" cy="126" rx="2.2" ry="1.8"/>
      <ellipse cx="318" cy="136" rx="2" ry="1.6"/>
    </g>

    <!-- adipose fin (SALMONID SIGNATURE) -->
    <path d="M 180 159 C 170 145, 152 144, 144 155 C 150 161, 166 163, 180 161 Z"
          fill="#BBC7CE" stroke="#465562" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- pelvic + anal -->
    <path d="M 340 256 C 328 280, 306 288, 296 285 C 310 270, 326 258, 342 253 Z"
          fill="#CDD8DD" stroke="#465562" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 224 256 C 212 280, 192 287, 182 284 C 196 268, 212 254, 228 250 Z"
          fill="#CDD8DD" stroke="#465562" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- body silhouette (a touch more streamlined) -->
    <path d="M 582 199 C 548 176, 508 158, 472 154 C 400 143, 336 141, 296 145 C 214 151, 148 167, 108 179 L 108 221 C 158 239, 228 257, 308 261 C 400 263, 482 251, 522 231 C 548 221, 566 212, 582 199 Z"
          fill="url(#chromeSheen)" stroke="#465562" stroke-width="2.6" stroke-linejoin="round"/>

    <!-- countershading: gunmetal blue back + white belly -->
    <g clip-path="url(#bodyClip)">
      <path d="M 90 100 L 590 100 L 592 191 C 540 184, 460 182, 380 184 C 280 186, 180 185, 90 187 Z"
            fill="#6C8494" opacity="0.82"/>
      <path d="M 90 305 L 592 305 L 592 235 C 540 243, 460 249, 380 252 C 280 254, 180 250, 90 242 Z"
            fill="#FCFEFE" opacity="0.9"/>
    </g>

    <!-- very faint rose lateral stripe (sea-run) -->
    <g clip-path="url(#bodyClip)">
      <path d="M 110 206 C 260 211, 420 209, 552 200 C 553 205, 553 209, 552 212 C 420 220, 260 222, 110 217 Z"
            fill="#D98AA8" opacity="0.38"/>
    </g>

    <!-- faded spots, mostly upper back and tail -->
    <g clip-path="url(#bodyClip)" fill="#4A5560" opacity="0.55">
      <ellipse cx="150" cy="172" rx="2.4" ry="2"/>
      <ellipse cx="178" cy="166" rx="2.4" ry="2"/>
      <ellipse cx="168" cy="182" rx="2" ry="1.7"/>
      <ellipse cx="206" cy="170" rx="2.4" ry="2"/>
      <ellipse cx="200" cy="184" rx="2" ry="1.7"/>
      <ellipse cx="234" cy="164" rx="2.2" ry="1.8"/>
      <ellipse cx="240" cy="180" rx="2" ry="1.7"/>
      <ellipse cx="268" cy="170" rx="2.2" ry="1.8"/>
      <ellipse cx="296" cy="164" rx="2.2" ry="1.8"/>
      <ellipse cx="326" cy="172" rx="2.2" ry="1.8"/>
      <ellipse cx="356" cy="166" rx="2" ry="1.7"/>
      <ellipse cx="388" cy="172" rx="2" ry="1.7"/>
      <ellipse cx="420" cy="168" rx="2" ry="1.7"/>
      <ellipse cx="452" cy="174" rx="1.9" ry="1.6"/>
      <ellipse cx="484" cy="172" rx="1.8" ry="1.5"/>
    </g>

    <!-- gill cover line -->
    <path d="M 502 162 C 494 190, 496 216, 510 234" fill="none" stroke="#556773" stroke-width="2" opacity="0.5"/>

    <!-- mouth -->
    <path d="M 582 201 C 570 204, 560 206, 552 207" fill="none" stroke="#465562" stroke-width="2" stroke-linecap="round"/>

    <!-- eye -->
    <circle cx="538" cy="190" r="11.5" fill="#EBEFF1" stroke="#465562" stroke-width="1.5"/>
    <circle cx="538" cy="190" r="8.5" fill="#9FB0BA"/>
    <circle cx="537" cy="191" r="5.2" fill="#16181A"/>
    <circle cx="534.5" cy="187" r="2.1" fill="#FFFFFF"/>
  </g>

  <!-- ===================== PECTORAL FIN ===================== -->
  <g id="pecfin" data-pivot="472,210">
    <path d="M 472 210 C 448 234, 416 248, 400 244 C 420 226, 448 210, 472 204 Z"
          fill="#CDD8DD" stroke="#465562" stroke-width="2.2" stroke-linejoin="round"/>
    <g stroke="#8A9AA4" stroke-width="1.2" opacity="0.8" fill="none">
      <path d="M 468 210 L 406 240"/>
      <path d="M 466 214 L 410 244"/>
      <path d="M 464 207 L 420 231"/>
    </g>
  </g>
</svg>
