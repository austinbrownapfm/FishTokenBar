<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <clipPath id="bodyClip">
      <path d="M 578 198 C 545 176, 505 158, 470 154 C 400 143, 340 140, 300 143 C 220 148, 150 165, 110 178 L 110 222 C 160 240, 230 258, 310 262 C 400 264, 480 252, 520 232 C 545 222, 562 212, 578 198 Z"/>
    </clipPath>
    <linearGradient id="goldSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCEFB6"/>
      <stop offset="0.5" stop-color="#F6D869"/>
      <stop offset="1" stop-color="#FDF3C8"/>
    </linearGradient>
    <linearGradient id="pinkStripeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F49AC0"/>
      <stop offset="0.5" stop-color="#E56C9E"/>
      <stop offset="1" stop-color="#D4568A"/>
    </linearGradient>
  </defs>

  <!-- ===================== TAIL ===================== -->
  <g id="tail" data-pivot="112,200">
    <path d="M 112 180 L 66 150 L 58 176 L 74 200 L 58 224 L 66 250 L 112 220 Z"
          fill="#F2D272" stroke="#A9791F" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#CBA43E" stroke-width="1.4" opacity="0.7">
      <path d="M 108 186 L 70 160" fill="none"/>
      <path d="M 106 194 L 66 178" fill="none"/>
      <path d="M 106 206 L 66 200" fill="none"/>
      <path d="M 106 214 L 66 222" fill="none"/>
      <path d="M 108 220 L 70 240" fill="none"/>
    </g>
    <g fill="#7A5A1B" opacity="0.42">
      <ellipse cx="96" cy="176" rx="2.6" ry="2.2"/>
      <ellipse cx="90" cy="196" rx="2.4" ry="2"/>
      <ellipse cx="98" cy="212" rx="2.4" ry="2"/>
      <ellipse cx="88" cy="224" rx="2.2" ry="1.8"/>
    </g>
  </g>

  <!-- ===================== BODY ===================== -->
  <g id="body">
    <!-- dorsal -->
    <path d="M 362 150 C 352 108, 322 92, 292 98 C 300 118, 300 138, 290 150 Z"
          fill="#F0CE70" stroke="#A9791F" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#CBA43E" stroke-width="1.3" opacity="0.7" fill="none">
      <path d="M 300 146 L 300 104"/>
      <path d="M 314 148 L 316 100"/>
      <path d="M 330 148 L 336 104"/>
      <path d="M 346 148 L 352 116"/>
    </g>
    <g fill="#7A5A1B" opacity="0.42">
      <ellipse cx="312" cy="118" rx="2.4" ry="2"/>
      <ellipse cx="328" cy="124" rx="2.4" ry="2"/>
      <ellipse cx="320" cy="134" rx="2.2" ry="1.8"/>
    </g>

    <!-- adipose fin (SALMONID SIGNATURE) -->
    <path d="M 182 158 C 172 144, 154 143, 146 154 C 152 160, 168 162, 182 160 Z"
          fill="#EEC964" stroke="#A9791F" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- pelvic + anal -->
    <path d="M 342 256 C 330 280, 308 288, 298 285 C 312 270, 328 258, 344 253 Z"
          fill="#F5DE93" stroke="#A9791F" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 226 256 C 214 280, 194 287, 184 284 C 198 268, 214 254, 230 250 Z"
          fill="#F5DE93" stroke="#A9791F" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- body silhouette -->
    <path d="M 578 198 C 545 176, 505 158, 470 154 C 400 143, 340 140, 300 143 C 220 148, 150 165, 110 178 L 110 222 C 160 240, 230 258, 310 262 C 400 264, 480 252, 520 232 C 545 222, 562 212, 578 198 Z"
          fill="url(#goldSheen)" stroke="#A9791F" stroke-width="2.6" stroke-linejoin="round"/>

    <!-- countershading: warm amber back + cream belly -->
    <g clip-path="url(#bodyClip)">
      <path d="M 90 100 L 590 100 L 590 190 C 540 182, 460 180, 380 182 C 280 184, 180 183, 90 185 Z"
            fill="#E4A62E" opacity="0.8"/>
      <path d="M 90 305 L 590 305 L 590 234 C 540 242, 460 248, 380 251 C 280 253, 180 249, 90 241 Z"
            fill="#FEF8E0" opacity="0.85"/>
    </g>

    <!-- soft pink lateral stripe -->
    <g clip-path="url(#bodyClip)">
      <path d="M 108 205 C 260 211, 420 209, 552 199 C 553 206, 553 211, 552 214 C 420 224, 260 226, 108 219 Z"
            fill="url(#pinkStripeG)" opacity="0.85"/>
      <path d="M 130 207 C 280 212, 430 210, 545 202 C 545 205, 545 207, 545 209 C 430 216, 280 218, 130 214 Z"
            fill="#FBB9D8" opacity="0.6"/>
    </g>

    <!-- sparse, faint brownish spots (palomino melanophore reduction) -->
    <g clip-path="url(#bodyClip)" fill="#7A5A1B" opacity="0.4">
      <ellipse cx="160" cy="172" rx="2.6" ry="2.2"/>
      <ellipse cx="196" cy="178" rx="2.6" ry="2.2"/>
      <ellipse cx="232" cy="170" rx="2.6" ry="2.2"/>
      <ellipse cx="268" cy="180" rx="2.4" ry="2"/>
      <ellipse cx="304" cy="170" rx="2.6" ry="2.2"/>
      <ellipse cx="340" cy="180" rx="2.4" ry="2"/>
      <ellipse cx="376" cy="172" rx="2.4" ry="2"/>
      <ellipse cx="412" cy="180" rx="2.4" ry="2"/>
      <ellipse cx="448" cy="174" rx="2.2" ry="1.8"/>
      <ellipse cx="484" cy="180" rx="2.2" ry="1.8"/>
    </g>

    <!-- gill cover line -->
    <path d="M 500 162 C 492 190, 494 216, 508 234" fill="none" stroke="#B8862A" stroke-width="2" opacity="0.5"/>
    <!-- pink cheek blush -->
    <path d="M 512 196 C 528 192, 540 196, 544 204 C 536 210, 522 210, 512 206 Z" fill="#EE85B4" opacity="0.45"/>

    <!-- mouth -->
    <path d="M 578 200 C 566 203, 556 205, 548 206" fill="none" stroke="#A9791F" stroke-width="2" stroke-linecap="round"/>

    <!-- eye (NORMAL pigmented — not albino) -->
    <circle cx="536" cy="189" r="11.5" fill="#F3ECCE" stroke="#A9791F" stroke-width="1.5"/>
    <circle cx="536" cy="189" r="8.5" fill="#C9A24B"/>
    <circle cx="535" cy="190" r="5.2" fill="#16181A"/>
    <circle cx="532.5" cy="186" r="2.1" fill="#FFFFFF"/>
  </g>

  <!-- ===================== PECTORAL FIN ===================== -->
  <g id="pecfin" data-pivot="472,210">
    <path d="M 472 210 C 448 234, 416 248, 400 244 C 420 226, 448 210, 472 204 Z"
          fill="#F5DE93" stroke="#A9791F" stroke-width="2.2" stroke-linejoin="round"/>
    <g stroke="#CBA43E" stroke-width="1.2" opacity="0.8" fill="none">
      <path d="M 468 210 L 406 240"/>
      <path d="M 466 214 L 410 244"/>
      <path d="M 464 207 L 420 231"/>
    </g>
  </g>
</svg>
