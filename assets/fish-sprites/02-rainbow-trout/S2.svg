<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <clipPath id="bodyClipP">
      <path d="M 565 200 C 535 185, 500 172, 470 170 C 400 162, 320 160, 260 163 C 210 166, 165 176, 135 184 L 135 216 C 175 226, 230 236, 290 238 C 360 240, 440 232, 490 220 C 520 213, 545 208, 565 200 Z"/>
    </clipPath>
    <linearGradient id="parrSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF2EE"/>
      <stop offset="0.5" stop-color="#D6DED9"/>
      <stop offset="1" stop-color="#EDF1EC"/>
    </linearGradient>
  </defs>

  <!-- ===================== TAIL ===================== -->
  <g id="tail" data-pivot="137,200">
    <path d="M 137 184 L 95 160 L 88 182 L 102 200 L 88 218 L 95 240 L 137 216 Z"
          fill="#9AA87E" stroke="#3C4832" stroke-width="2.4" stroke-linejoin="round"/>
    <g stroke="#6A7A52" stroke-width="1.3" opacity="0.7">
      <path d="M 132 189 L 98 168" fill="none"/>
      <path d="M 130 196 L 94 182" fill="none"/>
      <path d="M 130 205 L 94 200" fill="none"/>
      <path d="M 132 214 L 98 232" fill="none"/>
    </g>
    <g fill="#232A22" opacity="0.8">
      <ellipse cx="118" cy="182" rx="2.2" ry="1.8"/>
      <ellipse cx="112" cy="198" rx="2" ry="1.7"/>
      <ellipse cx="118" cy="214" rx="2" ry="1.7"/>
    </g>
  </g>

  <!-- ===================== BODY ===================== -->
  <g id="body">
    <!-- dorsal -->
    <path d="M 352 168 C 344 132, 320 118, 296 124 C 302 140, 302 158, 294 168 Z"
          fill="#96A578" stroke="#3C4832" stroke-width="2.4" stroke-linejoin="round"/>
    <g stroke="#6A7A52" stroke-width="1.2" opacity="0.7" fill="none">
      <path d="M 302 164 L 302 130"/>
      <path d="M 316 165 L 320 126"/>
      <path d="M 332 165 L 338 132"/>
    </g>
    <g fill="#232A22" opacity="0.75">
      <ellipse cx="312" cy="140" rx="2" ry="1.7"/>
      <ellipse cx="326" cy="146" rx="2" ry="1.7"/>
    </g>

    <!-- adipose fin (SALMONID SIGNATURE) -->
    <path d="M 200 175 C 192 163, 176 162, 169 172 C 174 177, 188 178, 200 176 Z"
          fill="#8A996D" stroke="#3C4832" stroke-width="2" stroke-linejoin="round"/>

    <!-- pelvic + anal -->
    <path d="M 330 235 C 320 254, 302 261, 293 258 C 305 246, 320 236, 333 232 Z"
          fill="#CFC0A0" stroke="#3C4832" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 236 235 C 226 254, 208 261, 199 258 C 211 246, 226 236, 239 232 Z"
          fill="#CFC0A0" stroke="#3C4832" stroke-width="2" stroke-linejoin="round"/>

    <!-- body silhouette (slender) -->
    <path d="M 565 200 C 535 185, 500 172, 470 170 C 400 162, 320 160, 260 163 C 210 166, 165 176, 135 184 L 135 216 C 175 226, 230 236, 290 238 C 360 240, 440 232, 490 220 C 520 213, 545 208, 565 200 Z"
          fill="url(#parrSheen)" stroke="#3C4832" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- countershading -->
    <g clip-path="url(#bodyClipP)">
      <path d="M 100 120 L 590 120 L 590 194 C 540 189, 460 187, 380 189 C 290 190, 190 189, 100 190 Z"
            fill="#7C8A62" opacity="0.85"/>
      <path d="M 100 290 L 590 290 L 590 224 C 540 230, 460 234, 380 236 C 290 237, 190 234, 100 228 Z"
            fill="#F2F4EE" opacity="0.8"/>
    </g>

    <!-- PARR MARKS: row of grey-blue vertical ovals along the midline -->
    <g clip-path="url(#bodyClipP)" fill="#6B7E92" opacity="0.82">
      <ellipse cx="170" cy="199" rx="8" ry="15"/>
      <ellipse cx="204" cy="199" rx="8.5" ry="16"/>
      <ellipse cx="240" cy="199" rx="8.5" ry="16.5"/>
      <ellipse cx="278" cy="199" rx="9" ry="17"/>
      <ellipse cx="316" cy="199" rx="9" ry="17"/>
      <ellipse cx="354" cy="199" rx="8.5" ry="16.5"/>
      <ellipse cx="392" cy="199" rx="8.5" ry="16"/>
      <ellipse cx="428" cy="199" rx="8" ry="15"/>
      <ellipse cx="462" cy="199" rx="7" ry="13"/>
    </g>

    <!-- faint pink hint just forming along the lateral line -->
    <g clip-path="url(#bodyClipP)">
      <path d="M 150 202 C 280 205, 410 204, 520 199 C 520 202, 520 204, 520 206 C 410 210, 280 211, 150 208 Z"
            fill="#E88FB4" opacity="0.28"/>
    </g>

    <!-- small black spots forming on the back -->
    <g clip-path="url(#bodyClipP)" fill="#232A22" opacity="0.8">
      <ellipse cx="185" cy="178" rx="2" ry="1.7"/>
      <ellipse cx="222" cy="174" rx="2" ry="1.7"/>
      <ellipse cx="260" cy="178" rx="2" ry="1.7"/>
      <ellipse cx="298" cy="174" rx="2" ry="1.7"/>
      <ellipse cx="336" cy="178" rx="2" ry="1.7"/>
      <ellipse cx="374" cy="176" rx="1.9" ry="1.6"/>
      <ellipse cx="412" cy="178" rx="1.9" ry="1.6"/>
      <ellipse cx="448" cy="180" rx="1.8" ry="1.5"/>
    </g>

    <!-- gill cover -->
    <path d="M 496 176 C 490 194, 492 212, 504 226" fill="none" stroke="#4E5C3C" stroke-width="1.8" opacity="0.5"/>

    <!-- mouth -->
    <path d="M 565 202 C 554 204, 546 205, 539 206" fill="none" stroke="#3C4832" stroke-width="1.8" stroke-linecap="round"/>

    <!-- eye (relatively large on juvenile) -->
    <circle cx="524" cy="193" r="11" fill="#EDE6CC" stroke="#3C4832" stroke-width="1.4"/>
    <circle cx="524" cy="193" r="8" fill="#B8A458"/>
    <circle cx="523" cy="194" r="5" fill="#16181A"/>
    <circle cx="520.5" cy="190" r="2" fill="#FFFFFF"/>
  </g>

  <!-- ===================== PECTORAL FIN ===================== -->
  <g id="pecfin" data-pivot="466,214">
    <path d="M 466 214 C 446 234, 420 245, 406 242 C 424 226, 446 213, 466 208 Z"
          fill="#CFC0A0" stroke="#3C4832" stroke-width="2" stroke-linejoin="round"/>
    <g stroke="#A89670" stroke-width="1.1" opacity="0.8" fill="none">
      <path d="M 462 214 L 412 238"/>
      <path d="M 460 218 L 416 241"/>
    </g>
  </g>
</svg>
